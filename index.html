<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Flag Explorer 🌎</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Arial Rounded MT Bold',sans-serif;background:#f0f7ff;color:#153568}main{max-width:850px;margin:auto;padding:16px}header{background:#17448d;color:white;border-radius:24px;text-align:center;padding:22px 12px}h1{margin:0;font-size:clamp(25px,6vw,42px)}header p{margin:6px}.tabs{display:flex;gap:12px;margin:16px 0}.tabs button{flex:1}button{cursor:pointer;font:inherit;font-weight:800;border:0;border-radius:17px;padding:15px;background:#fff;color:#153568;box-shadow:0 3px 0 #c7d9ef;touch-action:manipulation}button:focus-visible{outline:4px solid orange}.tabs button.active,.next{background:#276eea;color:#fff}.hero{background:white;border-radius:24px;text-align:center;padding:18px;margin-bottom:16px}.hero img{width:min(76vw,330px);height:195px;object-fit:contain;border-radius:8px}.hero h2{font-size:clamp(28px,7vw,44px);margin:8px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tile{min-width:0;min-height:115px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:9px}.tile img{width:100%;max-width:145px;height:65px;object-fit:contain}.tile span{font-size:clamp(10px,2.4vw,15px);overflow-wrap:anywhere}.tile.chosen{outline:4px solid #347cf6;background:#e2efff}.next{width:100%;font-size:21px;margin-top:12px}.quizgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.quizgrid .tile{min-height:165px}.quizgrid .tile img{height:105px}.correct{background:#c8f7d9!important;outline:4px solid #16a34a}.wrong{background:#ffe1dd!important;outline:4px solid #ee6257}.feedback{font-size:26px;font-weight:900;text-align:center;min-height:40px}.score{text-align:right;font-weight:900}footer{text-align:center;color:#63789a;margin:20px;font-size:13px}@media(max-width:480px){.grid{gap:8px}.tile{min-height:92px}.tile img{height:46px}.quizgrid .tile img{height:90px}.quizgrid .tile{min-height:145px}} .hint{background:#fff4c9;border-radius:15px;padding:14px;margin:12px 0;font-size:clamp(17px,4vw,23px);font-weight:800;color:#62430b}.mark{font-size:32px!important}.wrong{opacity:.65}.correct{animation:pop .5s ease 2}@keyframes pop{50%{transform:scale(1.05)}}button:disabled{cursor:default}@media(prefers-reduced-motion:reduce){.correct{animation:none}}</style></head><body><main><header><h1>🌎 Little Flag Explorer!</h1><p>Tap • Discover • Play ⭐</p></header><div class="tabs"><button id="learnTab" class="active" onclick="setMode('learn')">🌈 Learn Flags</button><button id="quizTab" onclick="setMode('quiz')">🎮 Play Game</button></div><div id="content"></div><footer>Made for little explorers ❤️ · Internet needed to load flag pictures</footer></main><script>
const countries=[['India','in'],['United States','us'],['United Kingdom','gb'],['Japan','jp'],['China','cn'],['France','fr'],['Germany','de'],['Australia','au'],['Canada','ca'],['Brazil','br'],['Italy','it'],['Singapore','sg'],['South Korea','kr'],['Spain','es'],['South Africa','za'],['United Arab Emirates','ae']];const hints=['An orange, white and green flag with a blue wheel!','Lots of little white stars and red and white stripes!','Red and white crosses on a blue flag!','A big red circle on white, like the sun!','A red flag with five yellow stars!','Three standing stripes: blue, white and red!','Black on top, red in the middle, gold at the bottom!','A blue flag with white stars and a little British flag!','One big red maple leaf in the middle!','A blue ball inside a yellow diamond on green!','Three standing stripes: green, white and red!','A white moon and five stars on red, with white below!','A red and blue circle with little black lines around it!','A wide yellow stripe between two red stripes!','A green sideways Y with lots of colours!','A red stripe standing up beside green, white and black!'];let wrong=new Set(),lastWrong=null,ctx;function sound(ok){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();let t=ctx.currentTime;let notes=ok?[523,659,784,1047]:[392,294,349,196];notes.forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(f,t+i*.15);if(!ok)o.frequency.exponentialRampToValueAtTime(f*.72,t+i*.15+.13);g.gain.setValueAtTime(.001,t+i*.15);g.gain.exponentialRampToValueAtTime(.18,t+i*.15+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.15+.14);o.connect(g);g.connect(ctx.destination);o.start(t+i*.15);o.stop(t+i*.15+.15)});if(ok){for(let i=0;i<5;i++){let b=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.09),ctx.sampleRate),d=b.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.exp(-j/(d.length*.18));let n=ctx.createBufferSource(),g=ctx.createGain();n.buffer=b;g.gain.value=.23;n.connect(g);g.connect(ctx.destination);n.start(t+.65+i*.13)}}}catch(e){}}let mode='learn' ,selected=0,question=0,score=0,answer=null;const el=document.getElementById('content');function flag(i){let [name,code]=countries[i];return `<img src="https://flagcdn.com/w320/${code}.png" alt="Flag of ${name}" loading="lazy">`};function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.8;u.pitch=1.1;speechSynthesis.speak(u)}}function setMode(m){mode=m;document.getElementById('learnTab').classList.toggle('active',m==='learn');document.getElementById('quizTab').classList.toggle('active',m==='quiz');render();if(m==='quiz')speak('Find '+countries[target()][0])};function choose(i){selected=i;render();speak(countries[i][0]+'. '+hints[i])}function nextLearn(){choose((selected+1)%countries.length)}function target(){return(question*7+3)%countries.length}function options(){let t=target();return [t,(t+3)%16,(t+8)%16,(t+12)%16].sort((a,b)=>((a*13+question*5)%17)-((b*13+question*5)%17))}let speechTimer;function pick(i){if(answer!==null||wrong.has(i))return;clearTimeout(speechTimer);if('speechSynthesis'in window)speechSynthesis.cancel();let ok=i===target();if(ok){answer=i;score++}else{wrong.add(i);lastWrong=i}sound(ok);render();speechTimer=setTimeout(()=>speak(ok?'Hooray! Great job! '+countries[i][0]+'. '+hints[i]:'Oopsie! Try again! '+hints[target()]),ok?1350:650)}function nextQuiz(){clearTimeout(speechTimer);question++;answer=null;wrong.clear();lastWrong=null;render();speak('Find '+countries[target()][0])}function reset(){clearTimeout(speechTimer);question=0;answer=null;wrong.clear();lastWrong=null;score=0;render();speak('Find '+countries[target()][0])}function render(){if(mode==='learn'){el.innerHTML=`<section class="hero"><div>👆 Tap a flag to hear its name!</div>${flag(selected)}<h2>${countries[selected][0]}</h2><div class="hint">💡 ${hints[selected]}</div><button onclick="speak(countries[selected][0]+'. '+hints[selected])">🔊 Hear the clue</button><button class="next" onclick="nextLearn()">Next flag ➜</button></section><div class="grid">${countries.map((c,i)=>`<button class="tile ${selected===i?'chosen':''}" onclick="choose(${i})">${flag(i)}<span>${c[0]}</span></button>`).join('')}</div>`}else{let t=target();el.innerHTML=`<section class="hero"><div class="score">⭐ ${score} stars</div><h2>Find ${countries[t][0]}!</h2><p>👆 Tap the correct flag!</p><div class="grid quizgrid">${options().map(i=>`<button class="tile ${answer===i?'correct':wrong.has(i)?'wrong':''}" onclick="pick(${i})" ${answer!==null||wrong.has(i)?'disabled':''}>${flag(i)}${wrong.has(i)?'<span class="mark">✕</span>':answer===i?'<span class="mark">✓</span>':''}${answer!==null?`<span>${countries[i][0]}</span>`:''}</button>`).join('')}</div><div class="feedback">${answer===t?'🎉 YAY! Great job! 👏':lastWrong!==null?'😄 Oopsie! Try another flag!':''}</div>${answer!==null?`<div class="hint">💡 ${hints[t]}</div><button class="next" onclick="nextQuiz()">Next flag ➜</button>`:`${lastWrong!==null?`<div class="hint">💡 ${hints[t]}</div>`:''}<button onclick="speak('Find '+countries[target()][0])">🔊 Say country name</button> <button onclick="speak(hints[target()])">💡 Hear a clue</button>`}</section><button onclick="reset()">↻ Start again</button>`}}render();</script></body></html>
